name: nearo
description: Nearo - proximity-based social nightlife app built with Flutter and Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.4.0
  cloud_functions: ^6.3.0
  firebase_storage: ^13.4.0
  firebase_messaging: ^16.2.1
  firebase_analytics: ^12.4.0
  firebase_crashlytics: ^5.2.1
  firebase_performance: ^0.11.4
  google_sign_in: ^6.3.0

  connectivity_plus: ^5.0.2
  network_info_plus: ^4.1.0
  permission_handler: ^11.3.0
  crypto: ^3.0.3
  uuid: ^4.3.3
  intl: ^0.19.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
